[project]
name = "patcolour"
version = "0.1.0"
description = "Partial color processing - keep specific regions in color, rest in monochrome"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/kako-jun/patcolour"
Repository = "https://github.com/kako-jun/patcolour"
Issues = "https://github.com/kako-jun/patcolour/issues"

[project.scripts]
patcolour = "patcolour.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
